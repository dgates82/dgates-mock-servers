name: Publish
on:
  push:
  pull_request:
  workflow_dispatch:
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}
jobs:
  smoke-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        mock: [twilio-mock, sendgrid-mock, postmark-mock]
    steps:
      - uses: actions/checkout@v5
      - name: Smoke test ${{ matrix.mock }}
        run: ./scripts/smoke-test.sh ${{ matrix.mock }}

  publish:
    needs: smoke-test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        mock: [twilio-mock, sendgrid-mock, postmark-mock]
    steps:
      - uses: actions/checkout@v5
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract version from tag
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
      - name: Build and push ${{ matrix.mock }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.mock }}
          push: true
          tags: |
            ghcr.io/dgates82/${{ matrix.mock }}:${{ env.VERSION }}
            ghcr.io/dgates82/${{ matrix.mock }}:latest
